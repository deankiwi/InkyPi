<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InkyPi - Preview</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            display: flex;
            justify_content: center;
            align-items: center;
            overflow: hidden;
        }
        
        .preview-container {
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            background-color: white; /* Simulate e-ink paper white */
            line-height: 0;
        }

        img {
            max-width: 100%;
            max-height: 100vh;
            display: block;
        }
    </style>
    <script>
        let lastModified = null;
        const refreshIntervalMs = 2000; // Check every 2 seconds

        async function refreshImage() {
            const img = document.getElementById('preview-image');
            if (!img) return;

            try {
                const headers = {};
                if (lastModified) {
                    headers['If-Modified-Since'] = lastModified;
                }

                const response = await fetch('{{ url_for("main.get_current_image") }}', { headers });
                
                if (response.status === 304) {
                    return;
                }

                if (!response.ok) {
                    console.error('Failed to fetch image:', response.status);
                    return;
                }

                const blob = await response.blob();
                const objectUrl = URL.createObjectURL(blob);
                
                // Avoid flickering by loading the new image before replacing
                const tempImg = new Image();
                tempImg.onload = () => {
                    img.src = objectUrl;
                    URL.revokeObjectURL(objectUrl); // Clean up memory
                };
                tempImg.src = objectUrl;

                lastModified = response.headers.get('Last-Modified');
            } catch (error) {
                console.error('Error refreshing image:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            refreshImage();
            setInterval(refreshImage, refreshIntervalMs);
        });
    </script>
</head>
<body>
    <div class="preview-container">
        <img id="preview-image" src="{{ url_for('static', filename='images/current_image.png') }}" alt="InkyPi Preview">
    </div>
</body>
</html>
